<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage Details - Pregnancy for Dads</title>
    <link rel="stylesheet" href="pregnancystages.css">
    <script src="stage-details.js" defer></script>
</head>
<body class="child-page">

<div class="container">
    <header>
        <a href="index.html" style="text-decoration: none;"><h1>⬅️ BACK</h1></a>
        <h1 id="stageTitle">Loading Stage...</h1>
    </header>

    <main class="stage-detail-card">
        <div class="detail-header">
            <img id="stageImage" src="" alt="Pregnancy Stage">
            <div class="quick-stats">
                <span class="week-badge" id="trimesterLabel">---</span>
                <h2 id="sizeComparison">Size: ---</h2>
            </div>
        </div>

        <section class="info-split">
            <div class="info-block">
                <h3>🔍 WHAT'S HAPPENING?</h3>
                <p id="developmentText">Loading developmental facts...</p>
            </div>
            <div class="info-block highlight">
                <h3>👨‍🍼 DAD'S TO-DO LIST</h3>
                <ul id="dadList">
                    </ul>
            </div>
        </section>
    </main>
</div>

</body>
</html>
